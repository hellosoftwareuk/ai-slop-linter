[package]
name = "slop"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "A fast AST-based TypeScript and Rust maintainability scanner"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
ignore = "0.4"
oxc_allocator = "=0.147.0"
oxc_ast = "=0.147.0"
oxc_ast_visit = "=0.147.0"
oxc_parser = "=0.147.0"
oxc_span = "=0.147.0"
ra_ap_syntax = "=0.0.349"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
